name: Build and deploy documentation

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Install documentation build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libxml2-utils xsltproc \
            docbook-xml docbook-xsl rsync

      - name: Install Hugo 0.144.2
        run: |
          curl --fail --location --silent --show-error \
            -o "${RUNNER_TEMP}/hugo.tar.gz" \
            https://github.com/gohugoio/hugo/releases/download/v0.144.2/hugo_0.144.2_linux-amd64.tar.gz
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"

      - name: Update PostgreSQL manuals
        run: make refresh

      - name: Update pgdoc Chinese manuals
        run: make sync-pgdoc

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          HUGO_SERVICES_GOOGLEANALYTICS_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: hugo --cleanDestinationDir --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Commit and push updated manuals
        run: |
          git add -A -- \
            content/en/postgresql content/zh/postgresql \
            data/manual_nav data/manual-sources.json data/manual-sources-zh.json \
            static/manual-nav static/postgresql \
            static/zh/manual-nav static/zh/postgresql
          if git diff --cached --quiet; then
            echo "Manual snapshots are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh PostgreSQL manuals"
          git push origin "HEAD:${GITHUB_REF}"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
