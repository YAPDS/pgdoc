{{ define "main" }}
<div class="breadcrumb"><a href="{{ .Site.Home.RelPermalink }}">{{ i18n "home" }}</a><span>/</span><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a><span>/</span>{{ .Title }}</div>
{{ if .Params.upstream }}{{ partial "version-links.html" . }}{{ end }}
<article class="article{{ if .Params.upstream }} article-upstream{{ end }}">
  <header class="article-header"><span class="eyebrow">{{ i18n "manualLabel" }}</span>{{ with .Params.source_version }}<div class="article-meta">PostgreSQL {{ . }}</div>{{ end }}</header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
