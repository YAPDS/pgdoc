baseURL = "/"
# Hugo's language key is "en"; HTML uses en-US (the BCP 47 form of en_US).
defaultContentLanguage = "en"
timeZone = "UTC"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[outputs]
home = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[languages]
  [languages.en]
    contentDir = "content/en"
    languageCode = "en-US"
    languageName = "English (US)"
    title = "PostgreSQL Documentation"
    weight = 1
    [languages.en.params]
      description = "Official PostgreSQL documentation"
  [languages.zh]
    contentDir = "content/zh"
    languageCode = "zh-CN"
    languageName = "简体中文"
    title = "PostgreSQL 中文文档"
    weight = 2
    [languages.zh.params]
      description = "PostgreSQL 中文手册"
